[package]
name = "bks-youtube"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bks-core.workspace = true
bks-platform.workspace = true
bks-preview.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# YouTube's youtube.com endpoints are NOT Cloudflare-fingerprint-gated the way
# Kick's are, so a plain rustls client passes — no `wreq`/BoringSSL needed.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2"] }
# The official live-chat feed (`official.rs`) is a gRPC stream spoken by hand.
prost = "0.14"
# Reads the stream's HTTP/2 trailers, where gRPC puts a mid-stream error.
http-body-util = "0.1"
once_cell = "1"
