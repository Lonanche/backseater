# CI + auto-release. Every push/PR runs formatting, clippy and tests. On main,
# a separate job builds and publishes the Windows installer only when the
# workspace version in Cargo.toml has no GitHub release — so releasing is just:
# bump the version (append -beta.N for a beta pre-release), update
# CHANGELOG.md, commit, push. The vX.Y.Z tag is created by the publish step;
# tags are never pushed by hand. A failed build releases nothing.
#
# Releases ship unsigned. If code signing is added later, it slots in at two
# points: backseater.exe before `vpk pack`, and the Setup.exe after it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the repository Rust toolchain
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version

      - name: Check formatting
        run: ./scripts/check.ps1 -Check fmt

      # bks-kick's `wreq` compiles BoringSSL from source: NASM for its x64
      # assembly, libclang for bindgen (LLVM is preinstalled on the runner).
      - uses: ilammy/setup-nasm@v1
      - name: Point bindgen at the runner's libclang
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        id: check-cache
        # rust-cache exports this globally; keep each post hook's policy scoped
        # to its own step when two cache instances share the job.
        env:
          CACHE_ON_FAILURE: 'false'
        with:
          shared-key: checks
          cache-on-failure: false

      # A failed Clippy run has no compiled test dependencies yet. Keep that
      # partial cache separate so it cannot occupy the immutable complete key.
      - uses: Swatinem/rust-cache@v2
        if: steps.check-cache.outputs.cache-hit != 'true'
        env:
          CACHE_ON_FAILURE: 'true'
        with:
          shared-key: checks-partial
          cache-on-failure: true

      - name: Clippy
        run: ./scripts/check.ps1 -Check clippy
      - name: Unit and headless GUI tests
        run: ./scripts/check.ps1 -Check test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Check inside the concurrency slot so another run cannot publish the
      # same version between this decision and the upload.
      - name: Check for an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = @(Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$')
          if ($m.Count -ne 1) { throw 'Expected one workspace version in Cargo.toml' }
          $v = $m.Matches[0].Groups[1].Value
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $null = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v$v" -Headers $headers
            $exists = 'true'
          }
          catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $exists = 'false'
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "pre=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          echo "exists=$exists" >> $env:GITHUB_OUTPUT

      # The version's "## vX.Y.Z" section of CHANGELOG.md becomes the release
      # notes. A pre-release version (0.3.0-beta.1) falls back to its stable
      # section (## v0.3.0) — betas inherit the upcoming version's notes, so
      # the changelog keeps one section per stable version, no beta sections.
      - name: Extract release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          function Find-Notes($header) {
            $m = [regex]::Match($content, "(?ms)^## $([regex]::Escape($header))\s*?\r?\n(.*?)(?=^## |\z)")
            if ($m.Success) { $m.Groups[1].Value.Trim() } else { $null }
          }
          $v = '${{ steps.version.outputs.version }}'
          $notes = Find-Notes "v$v"
          if (-not $notes) { $notes = Find-Notes ("v" + ($v -replace '-.*$')) }
          if (-not $notes) {
            Write-Error "CHANGELOG.md has no section for v$v (or its stable base version) — add one, then push again to release."
            exit 1
          }
          Set-Content notes.md $notes -Encoding utf8

      - name: Install the repository Rust toolchain
        if: steps.version.outputs.exists == 'false'
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version

      - uses: ilammy/setup-nasm@v1
        if: steps.version.outputs.exists == 'false'
      - name: Point bindgen at the runner's libclang
        if: steps.version.outputs.exists == 'false'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false'
        with:
          shared-key: release
          cache-on-failure: true

      - name: Build release executable
        if: steps.version.outputs.exists == 'false'
        run: ./scripts/check.ps1 -Check release

      # Assets and the icon are embedded in the exe, so the install payload is
      # the single binary.
      - name: Stage install payload
        if: steps.version.outputs.exists == 'false'
        run: |
          New-Item -ItemType Directory publish | Out-Null
          Copy-Item target\release\backseater.exe publish\

      - name: Install Velopack CLI
        if: steps.version.outputs.exists == 'false'
        run: dotnet tool install -g vpk

      # Fetch the previous release so vpk can build a delta package from it;
      # the very first release has nothing to download, which is fine.
      - name: Download previous release
        if: steps.version.outputs.exists == 'false'
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} ${{ steps.version.outputs.pre == 'true' && '--pre' || '' }}
        continue-on-error: true

      - name: Build installer
        if: steps.version.outputs.exists == 'false'
        run: >
          vpk pack
          --packId Backseater
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe backseater.exe
          --packTitle Backseater
          --packAuthors Lonanche
          --icon crates\app\resources\icon.ico
          --releaseNotes notes.md

      - name: Publish to GitHub Releases
        if: steps.version.outputs.exists == 'false'
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Backseater ${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}
          ${{ steps.version.outputs.pre == 'true' && '--pre' || '' }}
